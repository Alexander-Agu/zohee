<main class="min-h-screen bg-slate-50 flex flex-col items-center py-8 md:py-12 px-4 md:px-6 font-sans text-slate-900">
    <div class="w-full max-w-xl">

        <button (click)="goBack()"
            class="flex items-center gap-2 text-slate-400 hover:text-slate-900 transition-colors mb-6 md:mb-8 group p-2 -ml-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 transition-transform group-hover:-translate-x-1"
                fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
            </svg>
            <b class="text-[10px] md:text-xs uppercase tracking-widest">Back to Dashboard</b>
        </button>

        <div class="bg-white border border-slate-200 p-6 md:p-10 shadow-sm">
            <h2 class="text-xl md:text-2xl font-black uppercase tracking-tight text-slate-900 mb-6 md:mb-8">
                Create your template
            </h2>

            <form class="space-y-6 md:space-y-8" [formGroup]="templateForm" (ngSubmit)="createTemplate()">

                <div class="flex flex-col gap-2">
                    <label class="text-[10px] font-black uppercase tracking-widest text-slate-500">
                        Import Document
                    </label>

                    <div class="relative group">
                        <input type="file" (change)="onFileChange($event)"
                            class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" />

                        <div [class.border-blue-500]="selectedFile" [class.bg-blue-50]="selectedFile"
                            class="border-2 border-dashed border-slate-200 group-hover:border-blue-400 group-hover:bg-blue-50/30 transition-all p-6 md:p-8 flex flex-col items-center justify-center gap-3 text-center">

                            @if (!selectedFile) {
                            <svg xmlns="http://www.w3.org/2000/svg"
                                class="w-8 h-8 text-slate-300 group-hover:text-blue-400" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                    d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                            </svg>
                            <span class="text-xs md:text-sm text-slate-500">Click to upload or drag and drop</span>
                            } @else {
                            <div class="flex flex-col items-center animate-in fade-in zoom-in duration-300">
                                <div class="w-10 h-10 bg-blue-600 text-white flex items-center justify-center mb-2">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none"
                                        viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                                    </svg>
                                </div>
                                <span
                                    class="text-sm font-bold text-blue-600 uppercase tracking-tighter truncate max-w-[200px]">
                                    {{ selectedFile.name }}
                                </span>
                                <span class="text-[10px] text-blue-400 uppercase mt-1">File Ready</span>
                            </div>
                            }
                        </div>
                    </div>
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-[10px] font-black uppercase tracking-widest text-slate-500">
                        Document Title
                    </label>

                    <input type="text" formControlName="templateTitle" placeholder="e.g. Standard Employment Contract"
                        class="w-full border border-slate-200 px-4 py-3 text-sm focus:outline-none focus:border-blue-600 transition-colors" />
                </div>

                <button type="submit" [disabled]="templateForm.invalid || !selectedFile"
                    class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-slate-200 disabled:text-slate-400 text-white py-4 font-bold uppercase tracking-widest text-xs transition-all active:scale-[0.98]">
                    Create Template
                </button>

            </form>
        </div>

        <p
            class="text-center mt-8 text-[9px] md:text-[10px] text-slate-400 uppercase tracking-widest px-4 leading-relaxed">
            Templates are master copies and cannot be edited once signed.
        </p>
    </div>
</main>
